name: Release HDT plugin

on:
  push:
    tags:
      - "exporter-v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  HDT_REF_VERSION: "1.55.6"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Fetch HDT reference assemblies
        run: tools/fetch-hdt-refs.sh "$HDT_REF_VERSION"

      - name: Build and test
        run: |
          dotnet build -c Release
          dotnet test -c Release --no-build

      - name: Package the plugin
        run: tools/package-exporter.sh artifacts/release

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: exporter-plugin
          path: artifacts/release/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/exporter-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/release/*.zip artifacts/release/*.sha256 \
            --title "DustPlanner ${GITHUB_REF_NAME#exporter-}" \
            --notes "HDT plugin (built against HDT ${HDT_REF_VERSION} references) with the DustPlanner service bundled (win-x64, no runtime to install). Install: unzip and copy the DustPlanner folder into %AppData%\\HearthstoneDeckTracker\\Plugins\\. See docs/exporter-install.md."
