name: Release HDT plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  HDT_REF_VERSION: "1.55.6"

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Fetch HDT reference assemblies
        run: bash tools/fetch-hdt-refs.sh "$HDT_REF_VERSION"

      - name: Build and test
        run: |
          dotnet build -c Release
          dotnet test -c Release --no-build

      - name: Package the plugin
        run: bash tools/package-exporter.sh artifacts/release

      # DustPlanner.zip is the same file under a fixed name, so https://github.com/<owner>/DustPlanner/releases/latest/download/DustPlanner.zip
      # (the site's download button) always serves the newest release without going through the release page.
      - name: Fixed-name copy for the download link
        run: |
          cd artifacts/release
          cp DustPlanner-v*.zip DustPlanner.zip
          sha256sum DustPlanner.zip > DustPlanner.zip.sha256

      - name: Upload package artifact
        uses: actions/upload-artifact@v5
        with:
          name: exporter-plugin
          path: artifacts/release/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/release/*.zip artifacts/release/*.sha256 \
            --title "DustPlanner ${GITHUB_REF_NAME#v}" \
            --notes "Plugin for Hearthstone Deck Tracker with the DustPlanner service bundled (win-x64, nothing else to install; built against HDT ${HDT_REF_VERSION} references). Download DustPlanner.zip, unzip it and copy the DustPlanner folder into %AppData%\\HearthstoneDeckTracker\\Plugins\\, then enable it in HDT (Options -> Tracker -> Plugins). Full guide and screenshots: https://dustplanner.app/ (DustPlanner-v<version>.zip is the same file under its versioned name.)"
