name: Kick relay (Cloudflare Worker)

# Tests on every change under cloud/kick-worker; deploys only on a `worker-v*` tag.
# Secrets (GitHub → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID       — deploy (see cloud/kick-worker/README.md for the token template)
#   KICK_CLIENT_SECRET, TOKEN_ENCRYPTION_KEY           — pushed to the Worker as wrangler secrets on every deploy
on:
  push:
    branches: [main]
    paths: ["cloud/kick-worker/**", ".github/workflows/worker.yml"]
    tags: ["worker-v*"]
  pull_request:
    paths: ["cloud/kick-worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: cloud/kick-worker

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/kick-worker/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run types
      - run: npm run typecheck
      - run: npm test
      - name: Bundle (dry run, no account needed)
        run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    needs: test
    if: startsWith(github.ref, 'refs/tags/worker-v')
    runs-on: ubuntu-24.04
    environment: cloudflare
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/kick-worker/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Push secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
        run: |
          test -n "$KICK_CLIENT_SECRET" || { echo "KICK_CLIENT_SECRET secret is missing"; exit 1; }
          test -n "$TOKEN_ENCRYPTION_KEY" || { echo "TOKEN_ENCRYPTION_KEY secret is missing"; exit 1; }
          printf '%s' "$KICK_CLIENT_SECRET" | npx wrangler secret put KICK_CLIENT_SECRET
          printf '%s' "$TOKEN_ENCRYPTION_KEY" | npx wrangler secret put TOKEN_ENCRYPTION_KEY
      - name: Health check
        run: |
          sleep 10
          curl -fsS https://live.dustplanner.app/health
